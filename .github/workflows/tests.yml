name: CloseIQ Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: closeiq
      POSTGRES_USER: closeiq_app
      POSTGRES_PASSWORD: closeiq_ci_password

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: closeiq
          POSTGRES_USER: closeiq_app
          POSTGRES_PASSWORD: closeiq_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U closeiq_app -d closeiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]" python-dotenv "fastapi[standard]"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create database schema
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql \
            --host="$POSTGRES_HOST" \
            --username="$POSTGRES_USER" \
            --dbname="$POSTGRES_DB" \
            --file=database/schema.sql

      - name: Seed chart of accounts
        run: |
          PYTHONPATH=src python -c "from closeiq.seed_accounts import seed_accounts; print(seed_accounts('data/chart_of_accounts.csv'))"

      - name: Run CloseIQ tests
        run: |
          python -m unittest discover -s tests -v