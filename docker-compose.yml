services:
  db:
    image: postgres:17-alpine
    container_name: closeiq-postgres
    environment:
      POSTGRES_DB: closeiq
      POSTGRES_USER: closeiq_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - closeiq_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closeiq_app -d closeiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: closeiq-api
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: closeiq
      POSTGRES_USER: closeiq_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  closeiq_postgres_data: